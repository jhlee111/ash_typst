name: Precompile NIFs

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Create or verify release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view ${{ github.ref_name }} --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists"
          else
            gh release create ${{ github.ref_name }} \
              --repo ${{ github.repository }} \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

  build_release:
    needs: [create_release]
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }} | ${{ matrix.job.variant || 'default' }})
    runs-on: ${{ matrix.job.os }}

    permissions:
      contents: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15"]
        # Trimmed from upstream's 10 targets to the four this fork's consumer
        # actually runs on — Apple Silicon dev machines, x86_64 CI runners, and
        # Debian (glibc) containers on both arches. Building the typst crate
        # tree is ~30min per target under CARGO_BUILD_JOBS=1, so unused targets
        # are pure wall-clock. Keep this list in sync with `targets:` in
        # lib/ash_typst_nif.ex — a target in one but not the other 404s.
        # aarch64-linux builds natively on a GitHub ARM runner rather than under
        # `cross`: typst-kit pulls openssl-sys (it downloads typst universe
        # packages at render time), and the cross container has no arm64
        # libssl-dev — v0.1.3's cross job died on exactly that. ARM runners are
        # free for public repos, and ubuntu-22.04's glibc 2.35 is older than the
        # trixie runtime image's, so the artifact stays forward-compatible.
        job:
          - { target: aarch64-unknown-linux-gnu   , os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin        , os: macos-14         }
          - { target: x86_64-apple-darwin         , os: macos-14         }
          - { target: x86_64-unknown-linux-gnu    , os: ubuntu-22.04     }

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Extract crate information
        shell: bash
        run: |
          # Get the project version from mix.exs
          echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)" >> $GITHUB_ENV

      - name: Maybe add Rust flags for compilation
        shell: bash
        run: |
          echo "RUSTFLAGS=${{ matrix.job.rustflags }}" >> $GITHUB_ENV
        if: ${{ matrix.job.rustflags }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.job.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-precomp
          shared-key: ${{ matrix.job.target }}-${{ matrix.nif }}
          workspaces: |
            native/typst_nif

      - name: Set Rust stack size
        shell: bash
        run: |
          echo "RUST_MIN_STACK=16777216" >> $GITHUB_ENV
          echo "CARGO_BUILD_JOBS=1" >> $GITHUB_ENV

      - name: Build the project
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.1.4
        with:
          project-name: typst_nif
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
          cross-version: ${{ matrix.job.cross-version || 'from-source' }}
          project-dir: "native/typst_nif"
          cargo-args: ${{ matrix.job.cargo-args }}
          variant: ${{ matrix.job.variant }}

      - name: Artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.build-crate.outputs.file-path }}

      - name: Artifact upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}

      - name: Publish archives and packages
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            ${{ steps.build-crate.outputs.file-path }} \
            --repo ${{ github.repository }} \
            --clobber



